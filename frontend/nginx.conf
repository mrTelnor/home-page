map $sent_http_content_type $no_cache_html {
    default          "";
    ~*text/html      "no-cache";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Сжатие текстовых ассетов (бандл ~400 КБ шёл без компрессии)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Security-заголовки. ВАЖНО: add_header не наследуется в location, где есть
    # свой add_header, поэтому объявляем их в КАЖДОМ блоке (иначе документ,
    # отдаваемый через SPA-fallback на /index.html, теряет заголовки).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Хешированные ассеты неизменяемы — кэшируем надолго; отсутствующий ассет → 404
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, immutable" always;
    }

    # SPA fallback. index.html не кэшируем (иначе после деплоя браузер тянет
    # старые чанки) — задаётся через map по content-type, чтобы add_header
    # не «съедал» security-заголовки.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control $no_cache_html always;
    }
}
