server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Сжатие текстовых ассетов (бандл ~400 КБ шёл без компрессии)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Security-заголовки (сессия в HttpOnly-cookie + сторонний Telegram-виджет)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Хешированные ассеты неизменяемы — кэшируем надолго; отсутствующий ассет → 404
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html не кэшируем — иначе после деплоя браузер тянет старые чанки
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
