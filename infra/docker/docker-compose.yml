# Единая ротация логов: без max-size json-file растёт до заполнения диска.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  web:
    name: web
  internal:
    name: internal

volumes:
  letsencrypt:
  pg_data:
  portainer_data:
  bot_data:
  recipe_images:

services:
  # mem_limit на каждом сервисе: ВМ всего 2 ГБ, без потолков один распухший
  # процесс валит OOM-киллером всю машину вместе с ботом и постгресом.
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    mem_limit: 128m
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - letsencrypt:/letsencrypt
    networks:
      - web
    labels:
      # Dashboard
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`)
      - traefik.http.routers.traefik.entrypoints=websecure
      - traefik.http.routers.traefik.tls.certresolver=letsencrypt
      - traefik.http.routers.traefik.service=api@internal
      # IP whitelist
      - traefik.http.routers.traefik.middlewares=admin-ip@docker
      - traefik.http.middlewares.admin-ip.ipallowlist.sourcerange=${HOME_IP}/32

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Только localhost: доступ к БД снаружи — через SSH-туннель
      # (`ssh -L 5432:localhost:5432 homepage`). Публикация на 0.0.0.0
      # опасна — Docker вставляет правила в обход firewalld-зон.
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: backend
    restart: unless-stopped
    mem_limit: 384m
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      INVITE_CODE: ${INVITE_CODE}
      CRON_SECRET: ${CRON_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      BOT_SECRET: ${BOT_SECRET}
      RUSENDER_API_KEY: ${RUSENDER_API_KEY}
      RUSENDER_KEY_ID: ${RUSENDER_KEY_ID}
      EMAIL_FROM: ${EMAIL_FROM}
      RECIPE_IMAGES_DIR: /app/recipe_images
    volumes:
      - recipe_images:/app/recipe_images
    networks:
      - web
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      # API — public
      - traefik.http.routers.backend.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls.certresolver=letsencrypt
      # Swagger docs — restricted by IP
      - traefik.http.routers.backend-docs.rule=Host(`api.${DOMAIN}`) && (PathPrefix(`/docs`) || PathPrefix(`/openapi.json`) || PathPrefix(`/redoc`))
      - traefik.http.routers.backend-docs.entrypoints=websecure
      - traefik.http.routers.backend-docs.tls.certresolver=letsencrypt
      - traefik.http.routers.backend-docs.middlewares=admin-ip@docker
      - traefik.http.routers.backend-docs.priority=30
      # Service
      - traefik.http.services.backend.loadbalancer.server.port=8000
      - traefik.docker.network=web

  cron:
    build:
      context: ./cron
    container_name: cron
    restart: unless-stopped
    mem_limit: 128m
    logging: *default-logging
    environment:
      CRON_SECRET: ${CRON_SECRET}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      YADISK_USER: ${YADISK_USER}
      YADISK_APP_PASSWORD: ${YADISK_APP_PASSWORD}
    volumes:
      # Фото рецептов попадают в ежедневный бэкап (read-only)
      - recipe_images:/backup-src/recipe_images:ro
    networks:
      - web
      - internal
    depends_on:
      - backend

  bot:
    build:
      context: ./bot
    container_name: bot
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BOT_SECRET: ${BOT_SECRET}
      BACKEND_URL: http://backend:8000
      SITE_URL: ${SITE_URL}
      CRON_SECRET: ${CRON_SECRET}
      UPTIME_SECRET: ${UPTIME_SECRET}
      GOOGLE_SERVICE_ACCOUNT_B64: ${GOOGLE_SERVICE_ACCOUNT_B64}
      CALENDAR_CONFIGS: ${CALENDAR_CONFIGS}
      REMINDERS_DATA_PATH: /data/sent_reminders.json
      CALENDAR_DEFAULT_REMINDERS_MIN: ${CALENDAR_DEFAULT_REMINDERS_MIN:-30}
    volumes:
      - bot_data:/data
    networks:
      - web
    healthcheck:
      # /healthz реально дёргает Telegram get_me — ловит «HTTP жив, polling мёртв»
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.bot.rule=Host(`bot.${DOMAIN}`)
      - traefik.http.routers.bot.entrypoints=websecure
      - traefik.http.routers.bot.tls.certresolver=letsencrypt
      - traefik.http.services.bot.loadbalancer.server.port=8080
      - traefik.docker.network=web

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://api.${DOMAIN}
        VITE_TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
    container_name: frontend
    restart: unless-stopped
    mem_limit: 64m
    logging: *default-logging
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls.certresolver=letsencrypt
      - traefik.http.services.frontend.loadbalancer.server.port=80
      - traefik.docker.network=web

  portainer:
    image: portainer/portainer-ce:2.40.0
    container_name: portainer
    restart: unless-stopped
    mem_limit: 128m
    logging: *default-logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN}`)
      - traefik.http.routers.portainer.entrypoints=websecure
      - traefik.http.routers.portainer.tls.certresolver=letsencrypt
      - traefik.http.routers.portainer.middlewares=admin-ip@docker
      - traefik.http.services.portainer.loadbalancer.server.port=9000
