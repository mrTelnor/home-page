---
# Subsequent runs (SSH already on port 9922):
#   ansible-playbook -i inventory/hosts.yml playbooks/setup.yml

- name: Setup Home Page server
  hosts: homepage
  become: true

  pre_tasks:
    # Relay обязателен: URL и ключ должны быть непустыми, direct больше не поддерживается.
    # Ошибка останавливает любой запуск до system/docker/app и остальных ролей.
    # no_log обязателен: ключ и возможный токен в ошибочном URL не должны попасть в лог.
    - name: Assert Telegram relay variables are required and valid
      assert:
        that:
          - telegram_relay_url | length > 0
          - telegram_relay_key | length > 0
          - telegram_relay_url is match('^\S+\Z')
          - (telegram_relay_url_parts.scheme | default('', true)) == 'https'
          - (telegram_relay_url_parts.hostname | default('', true) | length) > 0
          - (telegram_relay_url_parts.username | default('', true) | length) == 0
          - (telegram_relay_url_parts.password | default('', true) | length) == 0
          - "'@' not in (telegram_relay_url_parts.netloc | default('', true))"
          - "'?' not in telegram_relay_url"
          - "'#' not in telegram_relay_url"
          - "'{token}' not in telegram_relay_url"
          - vault_telegram_bot_token not in telegram_relay_url
        fail_msg: >-
          vault_telegram_relay_url и vault_telegram_relay_key должны быть непустыми.
          URL должен быть абсолютным HTTPS без userinfo, query, fragment и токена.
          Значения скрыты.
        quiet: true
      vars:
        telegram_relay_url: "{{ vault_telegram_relay_url | default('') }}"
        telegram_relay_key: "{{ vault_telegram_relay_key | default('') }}"
        telegram_relay_url_parts: "{{ telegram_relay_url | urlsplit }}"
      no_log: true
      tags: [always]

  roles:
    - role: system
      tags: [system]
    - docker
    - app
    - firewalld
    - role: sshd
      tags: [sshd]
