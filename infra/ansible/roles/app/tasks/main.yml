---
# Чистим dangling-образы перед деплоем (профилактика — образы накапливаются
# после rebuild и занимают место).
- name: Prune dangling Docker images
  command: docker image prune -f
  register: prune_result
  changed_when: "'Total reclaimed space: 0B' not in prune_result.stdout"
  tags: [always]

# Кэш сборки `image prune` не трогает: образы собираются на ВМ, и кэш копился
# с каждым деплоем (к 2026-09 — 12.7 ГБ из 29 ГБ диска). Держим только свежий
# (неделя) — несменившиеся сервисы по-прежнему собираются из кэша.
- name: Prune Docker build cache older than a week
  command: docker builder prune -f --filter until=168h
  register: builder_prune_result
  changed_when: builder_prune_result.stdout is not search('Total:\s+0B')
  tags: [always]

- name: Create app directory
  file:
    path: /opt/home-page
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Create traefik config directory
  file:
    path: /opt/home-page/traefik
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Copy docker-compose.yml
  copy:
    src: ../../../docker/docker-compose.yml
    dest: /opt/home-page/docker-compose.yml
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Copy traefik.yml
  copy:
    src: ../../../docker/traefik/traefik.yml
    dest: /opt/home-page/traefik/traefik.yml
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Sync backend source
  ansible.posix.synchronize:
    src: "{{ inventory_dir }}/../../../backend/"
    dest: /opt/home-page/backend/
    dest_port: "{{ ansible_port | int }}"
    delete: true
    rsync_opts:
      - "--exclude=__pycache__"
      - "--exclude=.pytest_cache"
      - "--exclude=*.egg-info"
  tags: [backend]

- name: Sync cron config
  ansible.posix.synchronize:
    src: "{{ inventory_dir }}/../../docker/cron/"
    dest: /opt/home-page/cron/
    dest_port: "{{ ansible_port | int }}"
    delete: true
  tags: [cron]

- name: Sync frontend source
  ansible.posix.synchronize:
    src: "{{ inventory_dir }}/../../../frontend/"
    dest: /opt/home-page/frontend/
    dest_port: "{{ ansible_port | int }}"
    delete: true
    rsync_opts:
      - "--exclude=node_modules"
      - "--exclude=dist"
  tags: [frontend]

- name: Sync bot source
  ansible.posix.synchronize:
    src: "{{ inventory_dir }}/../../../bot/"
    dest: /opt/home-page/bot/
    dest_port: "{{ ansible_port | int }}"
    delete: true
    rsync_opts:
      - "--exclude=__pycache__"
      - "--exclude=.pytest_cache"
  tags: [bot]

# Вики читает базу знаний (Supabase) через пулер под ролью wiki_reader. Все четыре
# переменные не заданы или пусты — вики выключена (WIKI_DATABASE_URL пустой).
# Заданы частично или с символами, ломающими URL и .env compose, — деплой
# останавливается здесь, а не падает backend на старте. Пароль в URL кодируется
# в env.j2, поэтому для него запрещены только пробельные символы (в т.ч. перевод
# строки в конце значения).
- name: Assert wiki pooler variables are consistent
  assert:
    that:
      - (wiki_db_values | select | list | length) in [0, 4]
      - wiki_db_values[0] is match('^[A-Za-z0-9.-]*\\Z')
      - wiki_db_values[1] is match('^[0-9]*\\Z')
      - wiki_db_values[2] is match('^[A-Za-z0-9._-]*\\Z')
      - wiki_db_values[3] is match('^\\S*\\Z')
    fail_msg: >-
      Переменные вики (vault_wiki_db_host, vault_wiki_db_port, vault_wiki_db_user,
      vault_wiki_db_password) заданы не все или содержат недопустимые символы:
      host — буквы, цифры, точка, дефис; port — цифры; user — буквы, цифры,
      точка, дефис, подчёркивание; password — без пробельных символов.
  vars:
    wiki_db_values:
      - "{{ vault_wiki_db_host | default('') }}"
      - "{{ vault_wiki_db_port | default('') | string }}"
      - "{{ vault_wiki_db_user | default('') }}"
      - "{{ vault_wiki_db_password | default('') }}"
  no_log: true
  tags: [always]

- name: Generate .env from vault variables
  template:
    src: env.j2
    dest: /opt/home-page/.env
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  tags: [always]

# Vikunja живёт в общем postgres, но в своей базе и под своей ролью. Роль и база
# должны существовать до старта vikunja, поэтому postgres поднимаем заранее
# (на работающем проде — no-op) и ждём healthcheck.
- name: Ensure postgres is up before creating Vikunja database
  command: docker compose up -d --wait postgres
  args:
    chdir: /opt/home-page
  become_user: "{{ ansible_user }}"
  register: postgres_up
  changed_when: "'Started' in postgres_up.stderr or 'Recreated' in postgres_up.stderr"
  tags: [always, vikunja]

# Идемпотентно: CREATE — только если нет (\gexec), пароль синхронизируется с vault
# каждый прогон. SQL идёт через stdin, чтобы пароль не светился в ps и логах.
- name: Ensure Vikunja role and database
  command: >-
    docker exec -i postgres
    psql -U {{ vault_postgres_user }} -d {{ vault_postgres_db }} -v ON_ERROR_STOP=1
  args:
    stdin: |
      SELECT 'CREATE ROLE vikunja LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'vikunja')\gexec
      ALTER ROLE vikunja WITH LOGIN PASSWORD '{{ vault_vikunja_db_password | replace("'", "''") }}';
      SELECT 'CREATE DATABASE vikunja OWNER vikunja' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'vikunja')\gexec
  register: vikunja_db
  changed_when: "'CREATE ROLE' in vikunja_db.stdout or 'CREATE DATABASE' in vikunja_db.stdout"
  no_log: true
  tags: [always, vikunja]

# Vikunja работает от uid 1000, а свежий named volume принадлежит root — сервис
# падает в restart-loop с «permission denied» на /app/vikunja/files. Образ scratch
# (нет chown), поэтому правим владельца одноразовым alpine. Volume создаём через
# `compose create`, а не `docker volume create`, чтобы он был с метками compose.
- name: Ensure Vikunja files volume is owned by uid 1000
  shell: |
    set -e
    docker compose create --no-recreate vikunja > /dev/null
    vol=$(docker volume ls -q --filter label=com.docker.compose.volume=vikunja_files)
    docker run --rm -v "$vol":/f alpine:3.21 sh -c \
      '[ "$(stat -c %u /f)" = 1000 ] || { chown 1000 /f && echo CHANGED; }'
  args:
    chdir: /opt/home-page
  become_user: "{{ ansible_user }}"
  register: vikunja_files_owner
  changed_when: "'CHANGED' in vikunja_files_owner.stdout"
  tags: [always, vikunja]

# Единый шаг развёртывания: --build пересобирает изменившиеся образы
# (код вшивается в образ, поэтому без сборки изменения не применяются),
# Docker-кэш делает несменившиеся сервисы near-instant, --remove-orphans
# чистит контейнеры удалённых сервисов. Самовосстанавливается при сломанном
# образе. Используем shell (не docker_compose_v2): у модуля баг в post-action
# `compose images --format json` после --build.
- name: Build and start services
  shell: docker compose up -d --build --remove-orphans
  args:
    chdir: /opt/home-page
  become_user: "{{ ansible_user }}"
  register: compose_up
  changed_when: "'Recreated' in compose_up.stderr or 'Started' in compose_up.stderr or 'Built' in compose_up.stderr"
  tags: [always]

# Smoke-тест после деплоя: `compose up` рапортует успех, даже если контейнер
# затем упал в crash-loop. Опрашиваем публичные health-эндпоинты с ретраями
# (контейнерам нужно время подняться) — плейбук честно падает, если прод мёртв.
- name: Smoke test — backend /api/health
  uri:
    url: "https://api.{{ vault_domain }}/api/health"
    status_code: 200
    timeout: 10
  register: smoke_backend
  until: smoke_backend.status == 200
  retries: 12
  delay: 5
  tags: [always]

- name: Smoke test — bot /healthz
  uri:
    url: "https://bot.{{ vault_domain }}/healthz"
    status_code: 200
    timeout: 15
  register: smoke_bot
  until: smoke_bot.status == 200
  retries: 12
  delay: 5
  tags: [always]

# Первый старт дольше: vikunja прогоняет миграции своей БД, а Traefik
# получает сертификат для tracker.<domain>.
- name: Smoke test — tracker /api/v1/info
  uri:
    url: "https://tracker.{{ vault_domain }}/api/v1/info"
    status_code: 200
    timeout: 10
  register: smoke_tracker
  until: smoke_tracker.status == 200
  retries: 24
  delay: 5
  tags: [always]

# Вики: /api/wiki/health всегда отвечает 200, состояние — в поле status тела
# (ok / unavailable / disabled), поэтому смотрим на тело, а не на код ответа.
# Ожидаем ok, если переменные пулера заданы в vault, иначе disabled.
# Пауза между повторами больше 10 с: backend отдаёт результат проверки из памяти
# 10 секунд, более частый повтор получил бы тот же ответ, а не новую проверку.
# ignore_errors: исход разбирают две следующие задачи.
- name: Smoke test — wiki /api/wiki/health
  uri:
    url: "https://api.{{ vault_domain }}/api/wiki/health"
    status_code: 200
    return_content: true
    timeout: 15
  register: smoke_wiki
  until: >-
    smoke_wiki.status == 200 and
    ((smoke_wiki.json | default({})).status | default('')) == wiki_expected_status
  retries: 4
  delay: 15
  ignore_errors: true
  vars:
    wiki_expected_status: "{{ 'ok' if (vault_wiki_db_host | default('')) else 'disabled' }}"
  tags: [always]

# Деплой падает, если эндпоинт не ответил 200 с известным статусом или статус
# противоречит настройке (disabled при заданных переменных — WIKI_DATABASE_URL
# не дошёл до backend).
- name: Smoke test — wiki health status matches configuration
  assert:
    that:
      - smoke_wiki.status == 200
      - wiki_status in [wiki_expected_status, 'unavailable']
    fail_msg: >-
      /api/wiki/health: код {{ smoke_wiki.status }}, status
      «{{ wiki_status }}», ожидался «{{ wiki_expected_status }}».
    quiet: true
  vars:
    wiki_expected_status: "{{ 'ok' if (vault_wiki_db_host | default('')) else 'disabled' }}"
    wiki_status: "{{ (smoke_wiki.json | default({})).status | default('') }}"
  # В --check модуль uri не выполняется: ответа нет, разбирать нечего
  when: smoke_wiki is not skipped
  tags: [always]

# unavailable — база знаний (Supabase) не отвечает, например проект на паузе.
# Это не поломка выкатки, поэтому деплой не падает, но предупреждение остаётся в выводе.
- name: Smoke test — warn when wiki database is unavailable
  debug:
    msg: >-
      ВНИМАНИЕ: /api/wiki/health отвечает status «unavailable» — backend не
      достучался до базы знаний (Supabase). Вики покажет ошибку вместо заметок.
      Проверь, не на паузе ли проект Supabase, и `docker logs backend`.
  when:
    - smoke_wiki is not skipped
    - ((smoke_wiki.json | default({})).status | default('')) == 'unavailable'
  tags: [always]
